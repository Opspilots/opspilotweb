    <linearGradient id="titleGrad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EBF2"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0%" cy="50%" r="60%">
