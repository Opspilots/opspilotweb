<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: la web pinta hasta los bordes físicos en iOS (notch /
       Dynamic Island / barra de gestos). Es lo que activa env(safe-area-inset-*),
       que ya consumen navbar, menú móvil y footer. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="color-scheme" content="dark" />

  <!-- Primary SEO -->
  <!-- title, description y robots los gestiona <PageSEO> por ruta (SSG) -->
  <meta name="keywords"
    content="desarrollo software a medida españa, software para pymes, equipo cercano de desarrollo, diagnóstico gratuito software, software fiscal aeat sii verifactu, crm sector energético, presupuestos obra bc3 fiebdc, erp agencias servicios, agentes ia mcp, modelos aeat 303 130 347 390" />
  <meta name="author" content="OpsPilot" />
  <meta name="language" content="es" />
  <meta name="geo.region" content="ES" />
  <meta name="geo.placename" content="Córdoba" />
  <!-- canonical + alternates los gestiona <PageSEO> por ruta (SSG) para evitar duplicados -->


  <!-- Open Graph (og:type/url/title/description los gestiona <PageSEO> por ruta) -->
  <meta property="og:image" content="https://opspilot.es/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="OpsPilot — Equipo español de desarrollo de software a medida y productos verticales" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:site_name" content="OpsPilot" />

  <!-- Twitter Card (twitter:card/title/description los gestiona <PageSEO> por ruta) -->
  <meta name="twitter:image" content="https://opspilot.es/images/og-image.png" />

  <!-- Schema.org structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://opspilot.es/#organization",

        "slogan": "Tecnología que encaja con cómo trabajas.",
        "foundingDate": "2024",
        "areaServed": { "@type": "Country", "name": "España" },
        "address": { "@type": "PostalAddress", "addressCountry": "ES", "addressLocality": "Córdoba", "addressRegion": "Andalucía" },
        "geo": { "@type": "GeoCoordinates", "latitude": 37.8882, "longitude": -4.7794 },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+34-640-756-126",
          "contactType": "customer service",
          "availableLanguage": ["Spanish"],
          "email": "opspilot.contact@gmail.com"
        }
      },
      {
        "@type": "ProfessionalService",
        "@id": "https://opspilot.es/#service",
        "name": "OpsPilot — Desarrollo de software a medida",
        "url": "https://opspilot.es",
        "image": "https://opspilot.es/images/og-image.png",
        "priceRange": "€€",
        "areaServed": "ES",
        "serviceType": "Desarrollo de software a medida, integraciones, agentes IA, ERP y CRM",
        "provider": { "@id": "https://opspilot.es/#organization" }
      },
      {
        "@type": "WebSite",
        "@id": "https://opspilot.es/#website",
        "name": "OpsPilot",
        "url": "https://opspilot.es",
        "inLanguage": "es-ES",
        "publisher": { "@id": "https://opspilot.es/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://opspilot.es/recursos?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "ItemList",
        "@id": "https://opspilot.es/#productos",
        "name": "Productos verticales OpsPilot",
        "itemListElement": [
          {
            "@type": "SoftwareApplication",
            "position": 1,

            "url": "https://opspilot.es/recursos/fiscalidad-plataforma-fiscal-contable",
            "description": "Software fiscal y contable español: facturación, PGC, modelos AEAT (303, 130, 347, 390), SII y VeriFactu nativos, conciliación bancaria con OCR."
          },
          {
            "@type": "SoftwareApplication",
            "position": 2,
            "name": "EnergyDeal",
            "applicationCategory": "BusinessApplication",

          {
            "@type": "SoftwareApplication",
            "position": 3,
            "name": "Presupuestador",

            "operatingSystem": "Web",
            "url": "https://opspilot.es/recursos/presupuestador-obra-bc3",

          },
          {
            "@type": "SoftwareApplication",
            "position": 4,
            "name": "ERP OpsPilot",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://opspilot.es/recursos/erp-hosteleria-tpv-restaurantes",
            "description": "ERP para hostelería: TPV con mesas y comandas, inventario y pedidos a proveedores, turnos de personal, reservas y cierre de caja con analítica en tiempo real."
          }
        ]
      }
    ]
  }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
  <!-- Carga no bloqueante: se aplica como print y se promueve a all en onload -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" />
  </noscript>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Analytics -->
  <script defer data-domain="opspilot.es" src="https://plausible.io/js/script.js"></script>
</head>
