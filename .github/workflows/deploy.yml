name: Deploy opspilotweb
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-opspilotweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync static site
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./html/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/opspilotweb/html/

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo /usr/bin/systemctl reload nginx"