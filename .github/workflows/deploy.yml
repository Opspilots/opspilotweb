name: Deploy — opspilotweb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build
        run: npm ci && npm run build

      - name: Rsync dist to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --omit-dir-times: algo (fuera de este pipeline) escribió directamente en
          # /var/www/opspilotweb/dist/ en el VPS con otro usuario del sistema, así que
          # las carpetas ya no las posee remote_user. Sin este flag, -a intenta ajustar
          # el mtime de esas carpetas y falla con "Operation not permitted" (exit 23)
          # aunque el contenido sí se transfiere bien. chown real requeriría root en el
          # VPS; omitir mtime de directorios es la solución estándar de rsync para
          # deploys donde el usuario remoto no es dueño del árbol de destino.
          switches: -avzr --delete --omit-dir-times
          path: dist/
          remote_path: /var/www/opspilotweb/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo nginx -s reload
